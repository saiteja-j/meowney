*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'DM Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;line-height:1.35;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--link);text-decoration:none}
h1,h2,h3{margin:0;font-family:'Fredoka','DM Sans',system-ui,sans-serif;font-weight:600}
.fd{font-family:'Fredoka','DM Sans',system-ui,sans-serif;font-weight:600}
#app{max-width:560px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;position:relative}
.main{flex:1;min-width:0;padding:16px 16px 24px;display:flex;flex-direction:column;gap:14px}
.muted{color:var(--muted)}
.small{font-size:13px}.xs{font-size:12px}
.row{display:flex;align-items:center;gap:12px;min-width:0}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.col{display:flex;flex-direction:column;gap:8px;min-width:0}
.wrap{flex-wrap:wrap}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.right{text-align:right}
.card{background:var(--card);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card.flush{padding:0 14px;gap:0}
.card.empty{align-items:flex-start}
.title{font-size:28px;line-height:1.2}
.h3{font-size:17px}
.btn{min-height:48px;padding:0 18px;border-radius:16px;border:1px solid var(--line2);background:var(--card);color:var(--ink);font-weight:700;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary);font-family:'Fredoka','DM Sans',sans-serif;font-size:18px;font-weight:600;min-height:54px;border-radius:18px}
.btn.soft{background:var(--soft);border-color:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.block{width:100%}
.btn.sm{min-height:44px;padding:0 14px;font-size:14px}
.btn[disabled]{opacity:0.5;cursor:default}
.ibtn[disabled]{opacity:0.4;cursor:default}
.ibtn{width:44px;height:44px;flex:none;border-radius:50%;border:1px solid var(--line2);background:var(--card);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;padding:0}
.ibtn.soft{background:var(--soft);border-color:transparent}
.link{min-height:44px;display:inline-flex;align-items:center;font-weight:700;font-size:14px;color:var(--link);background:none;border:0;padding:0}
.seg{display:flex;background:var(--track);border-radius:16px;padding:4px;gap:2px}
.seg button{flex:1;min-height:44px;border:0;border-radius:12px;background:transparent;color:var(--muted);font-weight:500;font-size:14px;padding:0 6px;min-width:0}
.seg button.on{background:var(--card);color:var(--ink);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line2);background:var(--card);color:var(--ink);font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:6px;max-width:100%}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:700}
.chip.dash{border:1.5px dashed var(--primary);color:var(--link);background:transparent;font-weight:700}
.chip.soft{background:var(--soft);border-color:var(--line2);font-weight:700}
.chip svg{flex:none}
.pill{height:28px;padding:0 12px;border-radius:999px;display:inline-flex;align-items:center;font-size:13px;font-weight:700;white-space:nowrap}
.pill.sm{height:24px;padding:0 10px;font-size:12px}
.p-ok{background:var(--ok-bg);color:var(--ok-fg)}.p-warn{background:var(--warn-bg);color:var(--warn-fg)}.p-bad{background:var(--bad-bg);color:var(--bad-fg)}.p-neu{background:var(--neu-bg);color:var(--neu-fg)}
.tile{width:40px;height:40px;flex:none;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--c,#64748B) 16%,var(--card))}
.tile.s{width:26px;height:26px;border-radius:8px}
.tile.l{width:44px;height:44px;border-radius:14px}
.tile svg{stroke:var(--c,#64748B);stroke:color-mix(in srgb,var(--c,#64748B) 66%,var(--ic-mix))}
svg.i{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.bar{position:relative;height:8px;border-radius:999px;background:var(--track)}
.bar>i{display:block;height:100%;border-radius:999px;background:var(--c,var(--primary));max-width:100%}
.bar>b{position:absolute;top:-3px;width:2px;height:14px;background:var(--ink);opacity:0.7}
.bar.big{height:12px}.bar.big>b{top:-4px;width:3px;height:20px;border-radius:2px;opacity:1}
.hero{background:var(--hero);color:var(--on-hero);border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:10px;min-width:0}
.hero .hm{color:var(--hero-muted)}
.hero .bar{background:var(--hero-track)}
.hero .bar>i{background:var(--orange)}
.hero .bar>b{background:var(--on-hero)}
.amtbig{font-family:'Fredoka',sans-serif;font-weight:600;font-size:clamp(34px,11vw,46px);line-height:1.1;letter-spacing:-0.5px;overflow-wrap:anywhere}
.amtmid{font-family:'Fredoka',sans-serif;font-weight:600;font-size:clamp(28px,9vw,36px);line-height:1.1;overflow-wrap:anywhere}
.chipamber{display:inline-flex;align-items:center;gap:6px;background:var(--amber-chip);color:var(--amber-chip-fg);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:700;max-width:100%}
.chipgood{background:#CDEFD9;color:#0B4F31}
.chipflat{background:var(--hero-soft);color:var(--on-hero)}
.donut{position:relative;width:96px;height:96px;flex:none;border-radius:50%}
.donut::after{content:'';position:absolute;inset:26px;border-radius:50%;background:var(--card)}
.list>.li{min-height:58px;display:flex;align-items:center;gap:12px;padding:8px 0;border-top:1px solid var(--line);min-width:0;width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;color:inherit}
.list>.li:first-child{border-top:0}
.li .t{font-size:15px;font-weight:500}
.li .s{font-size:12px;color:var(--muted)}
.amt{font-family:'Fredoka',sans-serif;font-weight:600;font-size:15px;white-space:nowrap}
.amt.in{color:var(--good)}
.nav{position:sticky;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);align-items:center;padding:6px 6px 8px;margin-top:auto}
.nav button{min-height:52px;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:12px;font-weight:500;min-width:0}
.nav button.on{color:var(--primary);font-weight:700}
.nav .fab{width:52px;height:52px;border-radius:50%;background:var(--orange);color:var(--on-orange);margin:0 auto;display:flex;align-items:center;justify-content:center;border:0;padding:0}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.lbl{font-size:13px;font-weight:700;color:var(--muted)}
.in{width:100%;min-height:48px;border:1px solid var(--line2);border-radius:14px;padding:0 14px;background:var(--card);font-size:16px;color:var(--ink);min-width:0}
textarea.in{padding:12px 14px;min-height:80px}
select.in{appearance:auto}
.in:focus,.btn:focus-visible,.chip:focus-visible,button:focus-visible{outline:3px solid color-mix(in srgb,var(--primary) 40%,transparent);outline-offset:1px}
.in.err{border-color:var(--bad)}
.errt{color:var(--bad);font-size:13px;font-weight:700}
.amtin{font-family:'Fredoka',sans-serif;font-weight:600;font-size:clamp(32px,11vw,48px);text-align:right;border:0;background:transparent;width:100%;min-width:0;color:var(--ink);padding:0;outline:none}
.sw{width:44px;height:44px;border-radius:50%;border:2.5px solid transparent;padding:3px;background:transparent;flex:none}
.sw.on{border-color:var(--ink)}
.sw i{display:block;width:100%;height:100%;border-radius:50%}
.icpick{width:44px;height:44px;border-radius:12px;border:1px solid var(--line2);background:var(--card);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;padding:0}
.icpick.on{background:var(--soft);border:2px solid var(--primary)}
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:50}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:560px;max-height:92dvh;overflow-y:auto;background:var(--card);border-radius:28px 28px 0 0;padding:10px 16px calc(20px + env(safe-area-inset-bottom,0px));z-index:60;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.sheet .grab{width:44px;height:5px;border-radius:999px;background:var(--line2);align-self:center;flex:none}
.sheet h2{font-size:22px}
.toast{position:fixed;left:12px;right:12px;bottom:calc(88px + env(safe-area-inset-bottom,0px));max-width:536px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:16px;padding:10px 14px;display:flex;align-items:center;gap:10px;z-index:70;font-size:14px}
.toast button{min-height:44px;background:none;border:0;color:var(--orange);font-weight:700;padding:0 6px}
.banner{border-radius:18px;padding:12px 14px;display:flex;align-items:center;gap:12px;min-width:0}
.banner.warn{background:var(--warn-bg);color:var(--warn-fg)}
.banner.bad{background:var(--bad-bg);color:var(--bad-fg)}
.banner.info{background:var(--soft)}
.banner button{flex:none}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.cal .dh{height:28px;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--muted)}
.cal button{height:44px;border:0;padding:0;display:flex;align-items:center;justify-content:center;background:transparent;color:var(--ink);font-size:15px;font-weight:500}
.cal button span{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.cal button.inr{background:color-mix(in srgb,var(--primary) 16%,transparent)}
.cal button.end span{background:var(--primary);color:var(--on-primary);font-weight:700}
.cal button.dim{color:var(--muted);opacity:0.55}
.bars{display:flex;align-items:flex-end}
.bars>button,.bars>div{flex:1;min-width:0;border:0;background:transparent;padding:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;color:var(--ink)}
.bars i{display:block;width:min(28px,70%);border-radius:8px 8px 4px 4px;background:var(--bar)}
.bars i.on{background:var(--bar-on)}
.bars span{font-size:12px;color:var(--muted)}
.bars span.on{color:var(--ink);font-weight:700}
.stack{display:flex;height:18px;border-radius:999px;overflow:hidden}
.switch{width:56px;height:44px;border:0;background:transparent;padding:0;display:flex;align-items:center;justify-content:flex-end;flex:none}
.switch span{width:52px;height:32px;border-radius:999px;background:var(--track);display:flex;align-items:center;padding:0 3px}
.switch.on span{background:var(--primary);justify-content:flex-end}
.switch i{width:26px;height:26px;border-radius:50%;background:#fff;display:block}
.monthcard{position:relative;touch-action:pan-y;user-select:none}
.thumb{width:72px;height:72px;border-radius:12px;border:1px solid var(--line2);background:var(--soft);object-fit:cover;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--muted);flex:none}
.bills{display:flex;gap:10px;flex-wrap:wrap}
.petov{position:fixed;inset:0;z-index:80;background:var(--peach);overflow-y:auto;display:flex;justify-content:center}
.petin{width:100%;max-width:560px;padding:calc(36px + env(safe-area-inset-top,0px)) 20px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:12px;min-height:100%}
.bubble{position:relative;background:var(--bubble);border-radius:22px;padding:14px 22px;text-align:center;max-width:100%}
.bubble::before{content:'';position:absolute;top:-7px;left:50%;margin-left:-7px;width:14px;height:14px;background:var(--bubble);transform:rotate(45deg)}
.bubble>*{position:relative}
.worth{display:flex;gap:8px;width:100%}
.worth button{flex:1;min-height:64px;border:1px solid var(--line2);border-radius:18px;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:13px;font-weight:500}
.worth button.on{border:2.5px solid var(--primary);background:var(--soft);font-weight:700}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes chew{0%,100%{transform:translateY(0) rotate(0)}25%{transform:translateY(-5px) rotate(-2deg)}75%{transform:translateY(-3px) rotate(2deg)}}
@keyframes wob{0%,100%{transform:rotate(0)}25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}
@keyframes pop{0%{transform:scale(0.6);opacity:0}70%{transform:scale(1.06);opacity:1}100%{transform:scale(1)}}
@keyframes drain{from{width:var(--from)}to{width:var(--to)}}
.a-bob{animation:bob 2.6s ease-in-out infinite}
.a-chew{animation:chew 1.1s ease-in-out infinite;transform-origin:50% 90%}
.a-wob{animation:wob 0.5s ease-in-out 3}
.a-pop{animation:pop 0.5s ease-out}
.drain>i{animation:drain 1.4s ease-out}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:359px){.main{padding:12px 12px 20px}.hero{padding:16px}.card{padding:14px}.btn{padding:0 12px}.chip{padding:0 11px}.nav button{font-size:11px}.donut{width:80px;height:80px}.donut::after{inset:22px}}
@media (min-width:600px){.main{padding:24px 20px 28px}}
.hide{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--orange);display:inline-block;flex:none}

<script>
'use strict';
/* ---------- tiny helpers ---------- */
const $ = (s, r) => (r || document).querySelector(s);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = (p) => (p || '') + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const pad2 = (n) => String(n).padStart(2, '0');
const ymd = (d) => d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
const parseYmd = (s) => { const p = String(s).split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); };
const todayStr = () => ymd(new Date());
const mk = (s) => String(s).slice(0, 7);
const addMonths = (key, n) => { const p = key.split('-').map(Number); const d = new Date(p[0], p[1] - 1 + n, 1); return d.getFullYear() + '-' + pad2(d.getMonth() + 1); };
const daysIn = (key) => { const p = key.split('-').map(Number); return new Date(p[0], p[1], 0).getDate(); };
const addDays = (s, n) => { const d = parseYmd(s); d.setDate(d.getDate() + n); return ymd(d); };
const diffDays = (a, b) => Math.round((parseYmd(b) - parseYmd(a)) / 86400000);
const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const MON = MONTHS.map((m) => m.slice(0, 3));
const DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const monthLabel = (key) => { const p = key.split('-').map(Number); return MONTHS[p[1] - 1] + ' ' + p[0]; };
const monShort = (key) => MON[Number(key.slice(5, 7)) - 1];
const dayLabel = (s) => { const d = parseYmd(s); return d.getDate() + ' ' + MON[d.getMonth()]; };
const dayLong = (s) => { const t = todayStr(); if (s === t) return 'Today'; if (s === addDays(t, -1)) return 'Yesterday'; const d = parseYmd(s); return DOW[d.getDay()] + ', ' + d.getDate() + ' ' + MON[d.getMonth()]; };

  now = now || new Date(); const h = now.getHours(), dow = now.getDay(), t = ymd(now), key = mk(t), dom = now.getDate(), dim = daysIn(key), mo = now.getMonth() + 1;
  const all = live(); const list = baseEntries(); const spent = spendOf(list.filter((e) => mk(e.date) === key)); const budget = S.app.settings.budget;
  const lastDate = all.reduce((m, e) => (e.date > m ? e.date : m), ''); const gap = lastDate ? diffDays(lastDate, t) : 0;
  const incomeRecent = list.some((e) => e.t === 'i' && e.date >= addDays(t, -2) && e.date <= t);
  const clock = now.toLocaleTimeString('en-IN', { hour: 'numeric', minute: '2-digit', hour12: true }).replace(/\s*(am|pm)/i, (m, x) => ' ' + x.toLowerCase());
  const c = [];
  if (!all.length) c.push({ id: 'empty', mood: 'sleepy', s: ['Feed me your first entry.', 'My bowl is empty. So is your log.'], w: ['Welcome. Add your first entry whenever you’re ready.'] });
  if (h < 5) c.push({ id: 'late', mood: 'shocked', s: ['It’s ' + clock + '. Are you okay?', 'Spending money at ' + clock + '? Bold.'], w: ['It’s very late. Get some rest, the numbers will wait.'] });
  if (incomeRecent) c.push({ id: 'income', mood: 'smug', s: ['Look who has money again.', 'Salary landed? I can smell it.'], w: ['Money came in. Nice. Let’s make it last.'] });
  if (budget > 0 && spent > budget) c.push({ id: 'over', mood: 'crying', s: ['Over budget. I’m not mad, just disappointed.', 'The budget has left the chat.'], w: ['You’re over budget this month. It happens. Let’s look at it together.'] });
  else if (budget > 0 && (spent / budget) * 100 > (dom / dim) * 100 + 15) c.push({ id: 'fast', mood: 'shocked', s: ['Spending fast this month. Slow down a little?', 'Your wallet is sweating.'], w: ['You’re a little ahead of pace. A small slowdown will help.'] });
  if (all.length && gap >= 3) c.push({ id: 'gone', mood: 'sleepy', s: ['Where have you been? I haven’t eaten in ' + gap + ' days.', 'Missing entries. Missing you. Mostly the entries.'], w: ['Missed you. Add what you spent when you can.'] });
  if (dom <= 2) c.push({ id: 'start', mood: 'shocked', s: ['New month. Rent is lurking.', 'Fresh month, fresh ways to go broke.'], w: ['A fresh month. You’ve got this.'] });
  if (dom >= dim - 2) c.push({ id: 'end', mood: 'crying', s: ['Month-end. Survive, don’t splurge.', 'Final stretch. Paws off the wallet.'], w: ['Almost month-end. Nearly there.'] });
  if (mo === 1 && dom === 1) c.push({ id: 'ny', mood: 'happy', s: ['Happy New Year. Same wallet, new excuses.'], w: ['Happy New Year. A fresh start for your money.'] });
  if (mo === 8 && dom === 15) c.push({ id: 'aug15', mood: 'happy', s: ['Public holiday. Your wallet is still working.'], w: ['Happy Independence Day.'] });
  if (mo === 12 && dom === 25) c.push({ id: 'xmas', mood: 'munch', s: ['Festive season. Wallet, be brave.'], w: ['Merry Christmas to you.'] });
  if (dow === 1) c.push({ id: 'mon', mood: 'crying', s: ['Monday. Back to being broke.', 'Monday again. The wallet remembers.'], w: ['Monday. A fresh week, a fresh start.'] });
  if (dow === 5) c.push({ id: 'fri', mood: 'smug', s: ['Friday. I can already hear the wallet crying.', 'Friday plans? I’ll be watching.'], w: ['Friday! Enjoy it, kindly.'] });
  if (dow === 0 || dow === 6) c.push({ id: 'wknd', mood: 'munch', s: ['Weekend. Wallet, be brave.', 'Weekend spending is still spending.'], w: ['Weekend. Treat yourself, gently.'] });
  const gen = h < 12 ? { id: 'am', mood: 'happy', s: ['Good morning. Is the money still there?', 'Morning. Breakfast on you or on the budget?'], w: ['Good morning. Ready when you are.'] } : h < 17 ? { id: 'pm', mood: 'smug', s: ['Afternoon. Have you eaten? I have.', 'Afternoon check-in. Any sneaky spending?'], w: ['Good afternoon. How’s the day going?'] } : h < 22 ? { id: 'eve', mood: 'munch', s: ['Evening. What did you eat today?', 'Evening. Anything to confess?'], w: ['Good evening. Anything to log from today?'] } : { id: 'night', mood: 'sleepy', s: ['Late one. Anything to log before bed?'], w: ['Winding down. Anything to log from today?'] };
  c.push(gen);
  const last = S.lastGreetId; const pool = c.slice(0, 3).filter((x) => x.id !== last); const pick = pool.length ? pool[Math.floor(Math.random() * pool.length)] : c[0];
  const lines = per === 'sweet' ? pick.w : pick.s; S.lastGreetId = pick.id;
  return { id: pick.id, mood: pick.mood, text: lines[Math.floor(Math.random() * lines.length)] };
}

/* ---------- ENTRIES ---------- */
function filteredEntries(key) {
  const f = S.ui.filters, q = S.ui.search.trim().toLowerCase(); let hidden = 0;
  const base = baseEntries().filter((e) => mk(e.date) === key);
  const out = base.filter((e) => {
    if (!listable(e)) { hidden++; return false; }
    if (f.cats.length && (e.t === 'x' || f.cats.indexOf(e.cat || 'other') < 0)) return false;
    if (f.type && e.t !== f.type) return false;
    if (f.prof && e.prof !== f.prof) return false;
    if (f.tag && (e.tags || []).indexOf(f.tag) < 0) return false;
    if (f.bill && !(e.bills || []).length) return false;
    if (f.review && !e.review) return false;
    if (q) { const hay = ((e.note || '') + ' ' + catMeta(e).name + ' ' + (e.tags || []).join(' ') + ' ' + e.amt + ' ' + (e.acc || '')).toLowerCase(); if (hay.indexOf(q) < 0) return false; }
    return true;
  }).sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : b.ts - a.ts));
  return { out, hidden };
}
function entriesListHtml(key) {

  return html;
}

/* ---------- BUDGETS ---------- */
function budgetStatus(p, paceNow) { if (p > 100) return ['p-bad', 'Over budget']; if (p === 100) return ['p-neu', 'Fully used']; if (p >= 80) return ['p-warn', 'Near limit']; if (paceNow != null && p > paceNow + 15) return ['p-warn', 'Ahead of pace']; return ['p-ok', 'On track']; }

  else top = '<div class="h3 fd">No monthly budget yet</div><div class="small muted">Set one number for the month, then optionally split it across categories.</div><button class="btn primary" style="align-self:flex-start;min-height:48px;font-size:16px" data-act="bedit" data-id="overall">Set monthly budget</button>';

  rulesave: () => { const r = S.rdraft; let v = 0; if (r.cond !== 'any') { v = parseAmt(r.valStr); if (!(v > 0)) { r.err = 'Enter a number above zero.'; return render(); } if (r.cond === 'pct' && v > 500) { r.err = 'Use a percentage up to 500.'; return render(); } } const o = { id: r.id || uid('r_'), cats: r.cats, cond: r.cond, val: v, mood: r.mood }; const rules = S.app.settings.pet.rules; const i = rules.findIndex((x) => x.id === o.id); if (i >= 0) rules[i] = o; else rules.push(o); saveApp(); back(); },
  ruledel: () => { const rules = S.app.settings.pet.rules; const i = rules.findIndex((x) => x.id === S.rdraft.id); if (i >= 0) rules.splice(i, 1); saveApp(); back(); },
  ruleup: (d) => { const a = S.app.settings.pet.rules; const i = a.findIndex((x) => x.id === d.id); if (i > 0) { const t = a[i]; a[i] = a[i - 1]; a[i - 1] = t; saveApp(); render(); } },
  ruledown: (d) => { const a = S.app.settings.pet.rules; const i = a.findIndex((x) => x.id === d.id); if (i >= 0 && i < a.length - 1) { const t = a[i]; a[i] = a[i + 1]; a[i + 1] = t; saveApp(); render(); } },
  pmode: (d) => { S.sheet.d.mode = d.v; render(); },
  psave: () => { const x = S.sheet.d; const name = x.name.trim(); if (!name) { x.err = 'Give the profile a name.'; return render(); } if (S.app.profiles.some((p) => p.id !== x.id && p.name.toLowerCase() === name.toLowerCase())) { x.err = 'That name is already used.'; return render(); } if (x.id) { const p = profById(x.id); p.name = name; if (!p.owner) p.mode = x.mode; } else S.app.profiles.push({ id: 'p_' + uid(), name, mode: x.mode }); saveApp(); S.sheet = null; render(); },
  pdel: (d) => { const n = live().filter((e) => e.prof === d.id).length; if (n) { S.sheet.d.err = 'This profile has ' + n + ' entries. Move or delete them first.'; return render(); } S.app.profiles = S.app.profiles.filter((p) => p.id !== d.id); saveApp(); S.sheet = null; render(); },
  accadd: () => { const x = S.sheet.d; const n = x.name.trim(); if (!n) { x.err = 'Type a name first.'; return render(); } if (S.app.accounts.some((a) => a.toLowerCase() === n.toLowerCase())) { x.err = 'You already have that account.'; return render(); } S.app.accounts.push(n); x.name = ''; x.err = ''; saveApp(); render(); },
  accdel: (d) => { if (S.app.accounts.length > 1) { S.app.accounts.splice(Number(d.i), 1); saveApp(); render(); } },
  theme: (d) => { S.app.settings.theme = d.v; saveApp(); render(); },
  defcurpick: (d) => { S.app.settings.cur = d.code; saveApp(); S.ui.curQ = ''; S.sheet = null; render(); },
  export: async () => { try { await saveFile('meowney-' + todayStr() + '.csv', exportCSV(), 'text/csv'); toast('CSV saved'); } catch (e) { if (!e || e.code !== 'declined') toast('Couldn’t save the file.'); } },
  backup: async () => { try { await exportBackup(); } catch (e) { if (!e || e.code !== 'declined') toast('Couldn’t make the backup.'); } },
  restorego: async () => { try { await applyRestore(); } catch (e) { toast('Couldn’t restore that backup.'); } },
  impcancel: () => { S.imp = null; back(); }, impgo: () => runImport(),
  recdue: () => openSheet({ type: 'recdue' }),
  recadd: () => { dueRecurring().forEach((x) => { const r = x.r; const e = { id: uid('e_'), t: r.t, amt: r.amt, cur: r.cur || 'INR', cat: r.cat, acc: r.acc, prof: r.prof, date: x.date, note: r.note, tags: (r.tags || []).slice(), bills: [], worth: null, review: false, rec: r.id, ts: Date.now() }; if (r.orig != null) { e.orig = r.orig; e.rate = r.rate; } putEntry(e); r.last = x.key > r.last ? x.key : r.last; }); saveApp(); S.sheet = null; toast('Added'); },
  recskip: () => { dueRecurring().forEach((x) => { if (x.key > x.r.last) x.r.last = x.key; }); saveApp(); S.sheet = null; render(); }
};

/* ---------- events ---------- */
function setPath(path, val) {
  const parts = path.split('.'); const roots = { draft: S.draft, sd: S.sheet && S.sheet.d, rdraft: S.rdraft, imp: S.imp, ui: S.ui }; let o = roots[parts[0]]; if (!o) return;
  for (let i = 1; i < parts.length - 1; i++) o = o[parts[i]]; o[parts[parts.length - 1]] = val;
}
document.addEventListener('click', (ev) => {
  const el = ev.target.closest && ev.target.closest('[data-act]'); if (!el || el.disabled) return;
  if (el.tagName === 'INPUT' && el.type === 'radio') return; // handled in change
  const fn = ACT[el.dataset.act]; if (!fn) return;
  if (el.tagName === 'A') ev.preventDefault();
  try { fn(el.dataset, el, ev); } catch (e) { try { console.error(e); } catch (x) { /* ignore */ } toast('Something went wrong. Try again.'); }
});
document.addEventListener('change', (ev) => {
  const t = ev.target;
  if (t.tagName === 'INPUT' && t.type === 'file') {
    if (t.id === 'f-restore') { if (t.files[0]) readRestoreFile(t.files[0]); t.value = ''; return; }
    if (t.id === 'f-csv') { if (t.files[0]) readCSVFile(t.files[0]); t.value = ''; return; }
    if (/^f-(camera|gallery|pdf)$/.test(t.id)) { handleBillFiles(t.files).then(() => { t.value = ''; }); return; }
  }
  if (t.dataset && t.dataset.act && t.type === 'radio') { const fn = ACT[t.dataset.act]; if (fn) fn(t.dataset, t, ev); return; }
  if (t.dataset && t.dataset.bind) {
    let v = t.type === 'checkbox' ? t.checked : t.value; if (/^imp\.map\./.test(t.dataset.bind)) v = Number(v);
    setPath(t.dataset.bind, v);
    if (S.imp && /^imp\./.test(t.dataset.bind)) S.imp.preview = buildImport();
    if (t.dataset.render) render();
  }
});
document.addEventListener('input', (ev) => {
  const t = ev.target;
  if (t.id === 'q') { S.ui.search = t.value; const el = document.getElementById('elist'); if (el) el.innerHTML = entriesListHtml(S.ui.nav.entries || mk(todayStr())); return; }
  if (t.id === 'cursearch') { S.ui.curQ = t.value; const el = document.getElementById('curlist'); if (el) el.innerHTML = curListHtml(t.value.toLowerCase(), S.sheet && S.sheet.mode === 'def'); return; }
  if (t.dataset && t.dataset.bind && t.type !== 'checkbox' && t.tagName !== 'SELECT') { setPath(t.dataset.bind, t.value); if (S.imp && /^imp\./.test(t.dataset.bind)) S.imp.preview = buildImport(); }
});
let sw = null;
document.addEventListener('touchstart', (ev) => { const el = ev.target.closest && ev.target.closest('[data-swipe]'); if (!el) { sw = null; return; } const p = ev.touches[0]; sw = { x: p.clientX, y: p.clientY }; }, { passive: true });
document.addEventListener('touchend', (ev) => { if (!sw) return; const p = ev.changedTouches[0]; const dx = p.clientX - sw.x, dy = p.clientY - sw.y; sw = null; if (Math.abs(dx) > 60 && Math.abs(dy) < 45) ACT.emonth({ d: dx > 0 ? '-1' : '1' }); }, { passive: true });
document.addEventListener('keydown', (ev) => { if (ev.key === 'Escape') { if (S.viewer) { S.viewer = null; render(); } else if (S.sheet) closeSheet(); } });

/* ---------- backup / restore ---------- */
function normalizeApp(a) {
  const base = defaultApp(); a = a || {};
  const app = Object.assign(base, a, { settings: Object.assign(base.settings, a.settings || {}, { pet: Object.assign(base.settings.pet, ((a.settings || {}).pet) || {}) }) });
  if (!Array.isArray(app.cats) || !app.cats.length) app.cats = base.cats;
  if (!app.cats.find((c) => c.id === 'other')) app.cats.push(Object.assign({ budget: 0, archived: false }, DEF_CATS[DEF_CATS.length - 1]));
  if (!Array.isArray(app.profiles) || !app.profiles.length) app.profiles = base.profiles;
  if (!Array.isArray(app.accounts) || !app.accounts.length) app.accounts = base.accounts;
  if (!Array.isArray(app.recurring)) app.recurring = [];
  return app;
}
async function exportBackup() {
  const bills = {}; const aids = new Set(); Object.values(S.idx).forEach((e) => (e.bills || []).forEach((b) => aids.add(b.aid)));
  if (!hosted() && S.mode === 'idb') { for (const a of aids) { try { const rec = await idb.get('blobs', a); if (rec) bills[a] = { type: rec.type, b64: bufToB64(rec.buf) }; } catch (e) { /* skip missing */ } } }
  const data = { kind: 'finance-tracker-backup', v: 1, at: Date.now(), doc: { app: S.app, months: S.months }, bills };
  await saveFile('meowney-backup-' + todayStr() + '.json', JSON.stringify(data), 'application/json');
  S.app.lastBackup = Date.now(); saveApp(); toast('Backup saved'); 
}
function readRestoreFile(file) {
  const rd = new FileReader();
  rd.onload = () => {
    let d; try { d = JSON.parse(rd.result); } catch (e) { toast('That file isn’t a backup from this app.'); return; }
    if (!d || d.kind !== 'finance-tracker-backup' || !d.doc || !d.doc.app || typeof d.doc.months !== 'object') { toast('That file isn’t a backup from this app.'); return; }
    const n = Object.values(d.doc.months).reduce((s, m) => s + ((m && m.entries) || []).filter((e) => !e.del).length, 0);
    S.restoreData = d; confirmSheet({ title: 'Replace everything with this backup?', body: 'The backup from ' + esc(dayLabel(ymd(new Date(d.at || Date.now())))) + ' has ' + n + ' entries. Restoring replaces all entries, categories and settings on this device. Make a backup first if you aren’t sure.', ok: 'Restore', act: 'restorego', danger: true });
  };
  rd.onerror = () => toast('Couldn’t open that file.'); rd.readAsText(file);
}
async function applyRestore() {
  const d = S.restoreData; if (!d) return; S.sheet = null;
  const oldKeys = Object.keys(S.months);
  const months = {}; Object.keys(d.doc.months).forEach((k) => { if (/^\d{4}-\d{2}$/.test(k) && d.doc.months[k] && Array.isArray(d.doc.months[k].entries)) months[k] = d.doc.months[k]; });
  for (const k of oldKeys) { if (!months[k]) { try { await store.remove('m_' + k); } catch (e) { /* ignore */ } } }
  S.app = normalizeApp(d.doc.app); S.months = months; rebuildIndex();
  if (!hosted() && S.mode === 'idb') { for (const a of Object.keys(d.bills || {})) { try { await idb.put('blobs', a, { type: d.bills[a].type, buf: b64ToBuf(d.bills[a].b64) }); } catch (e) { /* skip */ } } }
  saveApp(); Object.keys(S.months).forEach(saveMonth); S.restoreData = null; S.ui.nav = { entries: '', budgets: '' }; S.ui.stack = ['home']; S.ui.tab = 'home'; render(true); toast('Backup restored');
}

/* ---------- boot ---------- */
async function boot() {
  S.loading = true; S.noSave = false; S.bootErr = ''; render();
  const getCap = async (n) => { try { if (!window.claude || !window.claude.use) return null; return await window.claude.use(n); } catch (e) { return null; } };
  const caps = await Promise.all(['db', 'user', 'assets', 'sample', 'downloads'].map(getCap));
  S.caps = { db: caps[0], user: caps[1], assets: caps[2], sample: caps[3], downloads: caps[4], imgOK: false, hosted: !!caps[2] };
  try { if (S.caps.sample && S.caps.sample.limits) { const l = await S.caps.sample.limits(); S.caps.imgOK = !!(l && l.images); } } catch (e) { S.caps.imgOK = false; }
  let id = null; try { if (S.caps.user && S.caps.user.id) id = await S.caps.user.id(); } catch (e) { id = null; }
  S.uid = id;
  if (S.caps.db && id) { try { store.col = S.caps.db.collection('data/users/' + id); S.mode = 'db'; } catch (e) { S.mode = 'local'; } }
  else {
    try { await idb.open(); S.mode = 'idb'; if (!S.caps.assets) S.caps.assets = localAssets; try { if (navigator.storage && navigator.storage.persist) S.persisted = await navigator.storage.persist(); } catch (e) { S.persisted = false; } }
    catch (e) { S.mode = 'local'; try { localStorage.setItem('ft:probe', '1'); localStorage.removeItem('ft:probe'); } catch (x) { S.mode = 'mem'; } }
  }
  let docs = {};
  try { docs = await store.load(); } catch (e) { S.noSave = true; S.bootErr = 'Couldn’t load your saved data, so nothing will be changed. Check your connection and tap Retry.'; docs = {}; }
  S.app = normalizeApp(docs.app);
  S.months = {}; Object.keys(docs).forEach((k) => { if (/^m_\d{4}-\d{2}$/.test(k) && docs[k] && Array.isArray(docs[k].entries)) S.months[k.slice(2)] = docs[k]; });
  rebuildIndex();
  const cutoff = Date.now() - 30 * 86400000; Object.values(S.idx).forEach((e) => { if (e.del && e.del < cutoff) purgeEntry(e.id); });
  S.loading = false; if (!S.ui.range) S.ui.range = presetRange('month'); try { S.greet = makeGreeting(); } catch (e) { S.greet = null; } render(true);
}
if (S.noSave === undefined) S.noSave = false;
try { history.replaceState({ root: 1 }, ''); } catch (e) { /* ignore */ }

let hiddenAt = 0;
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { hiddenAt = Date.now(); return; }
  if (!S.loading && hiddenAt && Date.now() - hiddenAt > 5 * 60000) { hiddenAt = 0; try { S.greet = makeGreeting(); } catch (e) { S.greet = null; } if (curView() === 'home' && S.ui.stack.length === 1) render(); }
});

boot();

</script>
<script>
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) { window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); }); }
</script>
